[project]
name = "podcast-transcribe"
version = "0.2.1"
description = "Transcribe a podcast episode (URL, RSS feed or local file) with Whisper on Groq, ready to pipe into an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["podcast", "transcription", "whisper", "groq", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
podcast-transcribe = "podcast_transcribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
